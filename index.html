<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        .settings {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
            border: 1px solid #eee;
        }

        .settings-group {
            margin-bottom: 15px;
        }

        .settings-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #666;
        }

        .settings-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .add-stock-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 2px solid #ddd;
            color: #666;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .symbol {
            font-weight: 600;
            color: #007bff;
        }

        .number {
            font-family: 'Monaco', 'Courier New', monospace;
            text-align: right;
        }

        .positive {
            color: #28a745;
        }

        .negative {
            color: #dc3545;
        }

        .delete-btn {
            background: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .loading {
            color: #999;
            font-style: italic;
        }

        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .summary {
            background: #f0f8ff;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #b0d4ff;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
        }

        .summary-label {
            font-weight: 600;
        }

        .summary-value {
            font-family: 'Monaco', 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .add-stock-form {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

            td, th {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Stock Tracker</h1>

        <div class="settings">
            <div class="settings-group">
                <label for="apiKey">Alpha Vantage API Key</label>
                <input type="text" id="apiKey" placeholder="Enter your Alpha Vantage API key">
            </div>
        </div>

        <div id="error"></div>

        <div id="summary" class="summary" style="display: none;"></div>

        <div class="add-stock-form">
            <div class="form-group">
                <label for="symbol">Stock Symbol</label>
                <input type="text" id="symbol" placeholder="e.g. AAPL" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" placeholder="e.g. 10.5" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label for="purchasePrice">Purchase Price</label>
                <input type="number" id="purchasePrice" placeholder="e.g. 150.25" step="0.01" min="0">
            </div>
            <button onclick="addStock()">Add Stock</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th style="text-align: right;">Quantity</th>
                        <th style="text-align: right;">Purchase Price</th>
                        <th style="text-align: right;">Current Price</th>
                        <th style="text-align: right;">Total Cost</th>
                        <th style="text-align: right;">Current Value</th>
                        <th style="text-align: right;">1 Day</th>
                        <th style="text-align: right;">1 Week</th>
                        <th style="text-align: right;">All Time</th>
                        <th style="text-align: center;">Action</th>
                    </tr>
                </thead>
                <tbody id="stockList">
                    <tr>
                        <td colspan="10" style="text-align: center; color: #999;">No stocks added yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'stocks';
        const PRICE_CACHE_KEY = 'priceCache';

        function getApiKey() {
            return document.getElementById('apiKey').value;
        }

        function saveStocks(stocks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks));
        }

        function getStocks() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }

        function savePriceCache(cache) {
            localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(cache));
        }

        function getPriceCache() {
            return JSON.parse(localStorage.getItem(PRICE_CACHE_KEY) || '{}');
        }

        function addStock() {
            const symbol = document.getElementById('symbol').value.toUpperCase().trim();
            const quantity = parseFloat(document.getElementById('quantity').value);
            const purchasePrice = parseFloat(document.getElementById('purchasePrice').value);

            if (!symbol || !quantity || !purchasePrice) {
                showError('Please fill in all fields');
                return;
            }

            const stocks = getStocks();
            stocks.push({
                id: Date.now(),
                symbol,
                quantity,
                purchasePrice,
                addedDate: new Date().toISOString()
            });

            saveStocks(stocks);
            document.getElementById('symbol').value = '';
            document.getElementById('quantity').value = '';
            document.getElementById('purchasePrice').value = '';

            renderStocks();
        }

        function deleteStock(id) {
            if (confirm('Delete this stock?')) {
                const stocks = getStocks();
                saveStocks(stocks.filter(s => s.id !== id));
                renderStocks();
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        async function fetchStockPrice(symbol) {
            const apiKey = getApiKey();
            if (!apiKey) {
                showError('Please enter your Alpha Vantage API key');
                return null;
            }

            const cache = getPriceCache();
            const cacheKey = `${symbol}_${new Date().toDateString()}`;

            if (cache[cacheKey]) {
                return cache[cacheKey];
            }

            try {
                const response = await fetch(
                    `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${apiKey}`
                );
                const data = await response.json();

                if (data['Global Quote'] && data['Global Quote']['05. price']) {
                    const priceData = {
                        price: parseFloat(data['Global Quote']['05. price']),
                        change: parseFloat(data['Global Quote']['09. change']),
                        changePercent: parseFloat(data['Global Quote']['10. change percent']),
                        timestamp: new Date().toISOString()
                    };

                    cache[cacheKey] = priceData;
                    savePriceCache(cache);
                    return priceData;
                } else if (data['Note']) {
                    showError('API rate limit reached. Please wait a minute and refresh.');
                    return null;
                } else {
                    showError(`Could not find price for ${symbol}`);
                    return null;
                }
            } catch (error) {
                showError(`Error fetching price: ${error.message}`);
                return null;
            }
        }

        async function renderStocks() {
            const stocks = getStocks();
            const tbody = document.getElementById('stockList');

            if (stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #999;">No stocks added yet</td></tr>';
                document.getElementById('summary').style.display = 'none';
                return;
            }

            let html = '';
            let totalCost = 0;
            let totalValue = 0;

            for (const stock of stocks) {
                const priceData = await fetchStockPrice(stock.symbol);

                if (!priceData) {
                    html += `
                        <tr>
                            <td class="symbol">${stock.symbol}</td>
                            <td class="number">${stock.quantity}</td>
                            <td class="number">$${stock.purchasePrice.toFixed(2)}</td>
                            <td colspan="7" class="loading">Loading...</td>
                        </tr>
                    `;
                    continue;
                }

                const currentPrice = priceData.price;
                const totalCostStock = stock.quantity * stock.purchasePrice;
                const currentValue = stock.quantity * currentPrice;
                const allTimeChange = currentPrice - stock.purchasePrice;
                const allTimeChangePercent = (allTimeChange / stock.purchasePrice) * 100;
                const dayChangePercent = priceData.changePercent;
                const weekChangePercent = dayChangePercent * 5; // Rough estimate

                totalCost += totalCostStock;
                totalValue += currentValue;

                const gainLoss = currentValue - totalCostStock;
                const gainLossPercent = (gainLoss / totalCostStock) * 100;

                html += `
                    <tr>
                        <td class="symbol">${stock.symbol}</td>
                        <td class="number">${stock.quantity}</td>
                        <td class="number">$${stock.purchasePrice.toFixed(2)}</td>
                        <td class="number">$${currentPrice.toFixed(2)}</td>
                        <td class="number">$${totalCostStock.toFixed(2)}</td>
                        <td class="number">$${currentValue.toFixed(2)}</td>
                        <td class="number ${dayChangePercent >= 0 ? 'positive' : 'negative'}">
                            ${dayChangePercent >= 0 ? '+' : ''}${dayChangePercent.toFixed(2)}%
                        </td>
                        <td class="number ${weekChangePercent >= 0 ? 'positive' : 'negative'}">
                            ${weekChangePercent >= 0 ? '+' : ''}${weekChangePercent.toFixed(2)}%
                        </td>
                        <td class="number ${allTimeChangePercent >= 0 ? 'positive' : 'negative'}">
                            ${allTimeChangePercent >= 0 ? '+' : ''}${allTimeChangePercent.toFixed(2)}%
                        </td>
                        <td style="text-align: center;">
                            <button class="delete-btn" onclick="deleteStock(${stock.id})">Delete</button>
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;

            // Show summary
            const gainLoss = totalValue - totalCost;
            const gainLossPercent = (gainLoss / totalCost) * 100;
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <div class="summary-row">
                    <span class="summary-label">Total Cost Basis:</span>
                    <span class="summary-value">$${totalCost.toFixed(2)}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Current Portfolio Value:</span>
                    <span class="summary-value">$${totalValue.toFixed(2)}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Total Gain/Loss:</span>
                    <span class="summary-value ${gainLoss >= 0 ? 'positive' : 'negative'}">
                        ${gainLoss >= 0 ? '+' : ''}$${gainLoss.toFixed(2)} (${gainLossPercent >= 0 ? '+' : ''}${gainLossPercent.toFixed(2)}%)
                    </span>
                </div>
            `;
            summary.style.display = 'block';
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('apiKey');
            if (saved) {
                document.getElementById('apiKey').value = saved;
            }

            document.getElementById('apiKey').addEventListener('change', () => {
                localStorage.setItem('apiKey', document.getElementById('apiKey').value);
            });

            renderStocks();
        });
    </script>
</body>
</html>
