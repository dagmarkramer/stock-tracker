<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        .settings {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 30px;
            border: 1px solid #eee;
        }

        .settings-group {
            margin-bottom: 15px;
        }

        .settings-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #666;
        }

        .settings-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .add-stock-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input,
        .form-group select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 2px solid #ddd;
            color: #666;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .symbol {
            font-weight: 600;
            color: #007bff;
        }

        .symbol-link {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .symbol-link:hover {
            text-decoration: underline;
        }

        .number {
            font-family: 'Monaco', 'Courier New', monospace;
            text-align: right;
        }

        .positive {
            color: #28a745;
        }

        .negative {
            color: #dc3545;
        }

        .edit-btn {
            background: #28a745;
            padding: 6px 12px;
            font-size: 12px;
        }

        .edit-btn:hover {
            background: #218838;
        }

        .delete-btn {
            background: #dc3545;
            padding: 6px 12px;
            font-size: 12px;
            margin-left: 5px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .cancel-edit {
            background: #6c757d;
            padding: 10px 20px;
            margin-left: 10px;
        }

        .cancel-edit:hover {
            background: #5a6268;
        }

        .loading {
            color: #999;
            font-style: italic;
        }

        .error {
            color: #dc3545;
            padding: 10px;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .summary {
            background: #f0f8ff;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #b0d4ff;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .summary-row:last-child {
            margin-bottom: 0;
        }

        .summary-label {
            font-weight: 600;
        }

        .summary-value {
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .search-container {
            margin-bottom: 30px;
            position: relative;
        }

        .search-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-input-group input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .search-input-group button {
            padding: 10px 20px;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-item:hover {
            background: #f0f0f0;
        }

        .search-result-symbol {
            font-weight: 600;
            color: #007bff;
            margin-bottom: 4px;
        }

        .search-result-name {
            font-size: 13px;
            color: #666;
        }

        .search-loading {
            padding: 12px;
            text-align: center;
            color: #999;
            font-style: italic;
        }

        .search-no-results {
            padding: 12px;
            text-align: center;
            color: #999;
        }

        @media (max-width: 768px) {
            .add-stock-form {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            table {
                font-size: 12px;
            }

            td, th {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 Stock Tracker</h1>

        <div class="settings">
            <div class="settings-group">
                <label for="apiKey">Alpha Vantage API Key</label>
                <input type="text" id="apiKey" placeholder="Enter your Alpha Vantage API key">
            </div>
        </div>

        <div id="error"></div>

        <div id="summary" class="summary" style="display: none;"></div>

        <div id="editingNotice" style="display: none; background: #cfe2ff; border: 1px solid #b6d4fe; padding: 10px; border-radius: 4px; margin-bottom: 20px; color: #084298;">
            Editing stock - make your changes and click "Save Stock"
        </div>

        <div class="search-container">
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="Search stocks by symbol or company name (e.g. AAPL, Apple, VUSA)">
                <button onclick="searchStocks()">Search</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <div class="add-stock-form">
            <div class="form-group">
                <label for="symbol">Stock Symbol</label>
                <input type="text" id="symbol" placeholder="From search above or e.g. AAPL.L" style="text-transform: uppercase;">
            </div>
            <div class="form-group">
                <label for="currency">Currency</label>
                <select id="currency">
                    <option value="EUR">EUR</option>
                    <option value="USD">USD</option>
                    <option value="GBP">GBP</option>
                    <option value="CHF">CHF</option>
                </select>
            </div>
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" placeholder="e.g. 10.5" step="0.01" min="0">
            </div>
            <div class="form-group">
                <label for="purchasePrice">Purchase Price</label>
                <input type="number" id="purchasePrice" placeholder="e.g. 150.25" step="0.01" min="0">
            </div>
            <button id="submitBtn" onclick="addStock()">Add Stock</button>
            <button id="cancelBtn" class="cancel-edit" onclick="cancelEdit()" style="display: none;">Cancel</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th style="text-align: right;">Quantity</th>
                        <th style="text-align: right;">Purchase Price (EUR)</th>
                        <th style="text-align: right;">Current Price (EUR)</th>
                        <th style="text-align: right;">Total Cost (EUR)</th>
                        <th style="text-align: right;">Current Value (EUR)</th>
                        <th style="text-align: right;">1 Day</th>
                        <th style="text-align: right;">1 Week</th>
                        <th style="text-align: right;">All Time</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="stockList">
                    <tr>
                        <td colspan="10" style="text-align: center; color: #999;">No stocks added yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'stocks';
        const PRICE_CACHE_KEY = 'priceCache';
        let editingStockId = null;

        const DEFAULT_RATES = {
            'EUR': 1.00,
            'USD': 0.86,
            'GBP': 1.18,
            'CHF': 0.95
        };

        function getApiKey() {
            return document.getElementById('apiKey').value;
        }

        function saveStocks(stocks) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks));
        }

        function getStocks() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        }

        function savePriceCache(cache) {
            localStorage.setItem(PRICE_CACHE_KEY, JSON.stringify(cache));
        }

        function getPriceCache() {
            return JSON.parse(localStorage.getItem(PRICE_CACHE_KEY) || '{}');
        }

        function getGoogleFinanceUrl(symbol, exchange) {
            const exchangeMap = {
                '.LON': 'LON',
                '.L':   'LON',
                '.DE':  'ETR',
                '.PA':  'EPA',
                '.EAM': 'AMS',
                '.SW':  'SWX',
            };
            const gfExchange = exchangeMap[exchange];
            if (gfExchange) {
                return `https://www.google.com/finance/quote/${symbol}:${gfExchange}`;
            }
            // For US stocks or unknown exchanges, use Yahoo Finance (works without exchange)
            return `https://finance.yahoo.com/quote/${symbol}`;
        }

        function addStock() {
            const symbolInput = document.getElementById('symbol').value.toUpperCase().trim();
            const currency = document.getElementById('currency').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const purchasePrice = parseFloat(document.getElementById('purchasePrice').value);

            if (!symbolInput || !quantity || !purchasePrice) {
                showError('Please fill in all fields');
                return;
            }

            // Parse symbol and exchange from input (e.g., "AAPL.L" -> symbol="AAPL", exchange=".L")
            const parts = symbolInput.split('.');
            const symbol = parts[0];
            const exchange = parts.length > 1 ? '.' + parts.slice(1).join('.') : '';

            const stocks = getStocks();

            if (editingStockId) {
                // Update existing stock
                const index = stocks.findIndex(s => s.id === editingStockId);
                if (index !== -1) {
                    stocks[index] = {
                        ...stocks[index],
                        symbol,
                        exchange,
                        currency,
                        quantity,
                        purchasePrice
                    };
                }
                cancelEdit();
            } else {
                // Add new stock
                stocks.push({
                    id: Date.now(),
                    symbol,
                    exchange,
                    currency,
                    quantity,
                    purchasePrice,
                    addedDate: new Date().toISOString()
                });
                document.getElementById('symbol').value = '';
                document.getElementById('currency').value = 'EUR';
                document.getElementById('quantity').value = '';
                document.getElementById('purchasePrice').value = '';
            }

            saveStocks(stocks);
            renderStocks();
        }

        function editStock(id) {
            const stocks = getStocks();
            const stock = stocks.find(s => s.id === id);

            if (stock) {
                editingStockId = id;
                const fullSymbol = stock.symbol + (stock.exchange || '');
                document.getElementById('symbol').value = fullSymbol;
                document.getElementById('currency').value = stock.currency || 'EUR';
                document.getElementById('quantity').value = stock.quantity;
                document.getElementById('purchasePrice').value = stock.purchasePrice;

                document.getElementById('submitBtn').textContent = 'Save Stock';
                document.getElementById('cancelBtn').style.display = 'inline-block';
                document.getElementById('editingNotice').style.display = 'block';

                document.querySelector('.add-stock-form').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function cancelEdit() {
            editingStockId = null;
            document.getElementById('symbol').value = '';
            document.getElementById('currency').value = 'EUR';
            document.getElementById('quantity').value = '';
            document.getElementById('purchasePrice').value = '';

            document.getElementById('submitBtn').textContent = 'Add Stock';
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('editingNotice').style.display = 'none';
        }

        function deleteStock(id) {
            if (confirm('Delete this stock?')) {
                const stocks = getStocks();
                saveStocks(stocks.filter(s => s.id !== id));
                if (editingStockId === id) {
                    cancelEdit();
                }
                renderStocks();
            }
        }

        function showError(msg) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        async function fetchStockPrice(symbol, exchange) {
            const apiKey = getApiKey();
            if (!apiKey) {
                showError('Please enter your Alpha Vantage API key');
                return null;
            }

            const fullSymbol = symbol + (exchange || '');
            const cache = getPriceCache();
            const cacheKey = `${fullSymbol}_${new Date().toDateString()}`;

            if (cache[cacheKey]) {
                return cache[cacheKey];
            }

            try {
                const response = await fetch(
                    `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${fullSymbol}&apikey=${apiKey}`
                );
                const data = await response.json();

                if (data['Global Quote'] && data['Global Quote']['05. price']) {
                    let price = parseFloat(data['Global Quote']['05. price']);
                    let change = parseFloat(data['Global Quote']['09. change']);
                    let changePercent = parseFloat(data['Global Quote']['10. change percent']);

                    // London Stock Exchange returns prices in pence, convert to pounds
                    const isLSE = exchange === '.L' || exchange.includes('LON') || exchange.includes('.L.');
                    if (isLSE) {
                        price = price / 100;
                        change = change / 100;
                    }

                    const priceData = {
                        price: price,
                        change: change,
                        changePercent: changePercent,
                        timestamp: new Date().toISOString()
                    };

                    cache[cacheKey] = priceData;
                    savePriceCache(cache);
                    return priceData;
                } else if (data['Note']) {
                    showError('API rate limit reached. Please wait a minute and refresh.');
                    return null;
                } else {
                    showError(`Could not find price for ${fullSymbol}`);
                    return null;
                }
            } catch (error) {
                showError(`Error fetching price: ${error.message}`);
                return null;
            }
        }

        async function getExchangeRate(fromCurrency) {
            if (fromCurrency === 'EUR') return 1;

            const cache = getPriceCache();
            const cacheKey = `rate_${fromCurrency}_EUR_${new Date().toDateString()}`;

            if (cache[cacheKey]) {
                return cache[cacheKey];
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 3000);

                const response = await fetch(
                    `https://api.exchangerate-api.com/v4/latest/${fromCurrency}`,
                    { signal: controller.signal }
                );
                clearTimeout(timeoutId);

                const data = await response.json();

                if (data.rates && data.rates.EUR) {
                    const rate = data.rates.EUR;
                    cache[cacheKey] = rate;
                    savePriceCache(cache);
                    return rate;
                }
                return DEFAULT_RATES[fromCurrency] || 1;
            } catch (error) {
                return DEFAULT_RATES[fromCurrency] || 1;
            }
        }

        async function renderStocks() {
            const stocks = getStocks();
            const tbody = document.getElementById('stockList');

            if (stocks.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #999;">No stocks added yet</td></tr>';
                document.getElementById('summary').style.display = 'none';
                return;
            }

            let html = '';
            let totalCost = 0;
            let totalValue = 0;
            let totalWeekChange = 0;

            for (const stock of stocks) {
                const priceData = await fetchStockPrice(stock.symbol, stock.exchange);
                const displaySymbol = stock.symbol + (stock.exchange || '');

                if (!priceData) {
                    html += `
                        <tr>
                            <td class="symbol">${displaySymbol}</td>
                            <td class="number">${stock.quantity}</td>
                            <td class="number">€${stock.purchasePrice.toFixed(2)}</td>
                            <td colspan="6" class="loading">Loading...</td>
                            <td style="text-align: center;">
                                <button class="edit-btn" onclick="editStock(${stock.id})">Edit</button>
                                <button class="delete-btn" onclick="deleteStock(${stock.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                    continue;
                }

                const exchangeRate = await getExchangeRate(stock.currency);
                if (!exchangeRate) {
                    html += `
                        <tr>
                            <td class="symbol">${displaySymbol}</td>
                            <td class="number">${stock.quantity}</td>
                            <td class="number">€${stock.purchasePrice.toFixed(2)}</td>
                            <td colspan="7" class="loading">Error loading exchange rate</td>
                        </tr>
                    `;
                    continue;
                }

                // For LSE stocks, ensure prices are in same unit
                let purchasePrice = stock.purchasePrice;
                let currentPrice = priceData.price;

                const purchasePriceEur = purchasePrice * exchangeRate;
                const currentPriceEur = currentPrice * exchangeRate;
                const totalCostStock = stock.quantity * purchasePriceEur;
                const currentValue = stock.quantity * currentPriceEur;
                const allTimeChange = currentPriceEur - purchasePriceEur;
                const allTimeChangePercent = (allTimeChange / purchasePriceEur) * 100;
                const dayChangePercent = priceData.changePercent;
                const weekChangePercent = dayChangePercent * 5;

                totalCost += totalCostStock;
                totalValue += currentValue;
                totalWeekChange += currentValue * (weekChangePercent / 100);

                const gainLoss = currentValue - totalCostStock;
                const gainLossPercent = (gainLoss / totalCostStock) * 100;

                const gfUrl = getGoogleFinanceUrl(stock.symbol, stock.exchange);
                html += `
                    <tr>
                        <td class="symbol"><a href="${gfUrl}" target="_blank" class="symbol-link">${displaySymbol}</a></td>
                        <td class="number">${stock.quantity}</td>
                        <td class="number">€${purchasePriceEur.toFixed(2)}</td>
                        <td class="number">€${currentPriceEur.toFixed(2)}</td>
                        <td class="number">€${totalCostStock.toFixed(2)}</td>
                        <td class="number">€${currentValue.toFixed(2)}</td>
                        <td class="number ${dayChangePercent >= 0 ? 'positive' : 'negative'}">
                            ${dayChangePercent >= 0 ? '+' : ''}${dayChangePercent.toFixed(2)}%
                        </td>
                        <td class="number ${weekChangePercent >= 0 ? 'positive' : 'negative'}">
                            ${weekChangePercent >= 0 ? '+' : ''}${weekChangePercent.toFixed(2)}%
                        </td>
                        <td class="number ${allTimeChangePercent >= 0 ? 'positive' : 'negative'}">
                            ${allTimeChangePercent >= 0 ? '+' : ''}${allTimeChangePercent.toFixed(2)}%
                        </td>
                        <td style="text-align: center;">
                            <button class="edit-btn" onclick="editStock(${stock.id})">Edit</button>
                            <button class="delete-btn" onclick="deleteStock(${stock.id})">Delete</button>
                        </td>
                    </tr>
                `;
            }

            tbody.innerHTML = html;

            const gainLoss = totalValue - totalCost;
            const gainLossPercent = (gainLoss / totalCost) * 100;
            const weekChangePercent = (totalWeekChange / totalValue) * 100;
            const summary = document.getElementById('summary');
            summary.innerHTML = `
                <div class="summary-row">
                    <span class="summary-label">Total Cost Basis (EUR):</span>
                    <span class="summary-value">€${totalCost.toFixed(2)}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Current Portfolio Value (EUR):</span>
                    <span class="summary-value">€${totalValue.toFixed(2)}</span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">1 Week Change (EUR):</span>
                    <span class="summary-value ${totalWeekChange >= 0 ? 'positive' : 'negative'}">
                        ${totalWeekChange >= 0 ? '+' : ''}€${totalWeekChange.toFixed(2)} (${weekChangePercent >= 0 ? '+' : ''}${weekChangePercent.toFixed(2)}%)
                    </span>
                </div>
                <div class="summary-row">
                    <span class="summary-label">Total Gain/Loss (EUR):</span>
                    <span class="summary-value ${gainLoss >= 0 ? 'positive' : 'negative'}">
                        ${gainLoss >= 0 ? '+' : ''}€${gainLoss.toFixed(2)} (${gainLossPercent >= 0 ? '+' : ''}${gainLossPercent.toFixed(2)}%)
                    </span>
                </div>
            `;
            summary.style.display = 'block';
        }

        function getExchangeSuffixFromRegion(region) {
            const regionMap = {
                'United Kingdom': '.LON',
                'Netherlands': '.EAM',
                'Germany': '.DE',
                'France': '.PA',
                'Switzerland': '.SW',
                'United States': '',
            };

            for (const [key, suffix] of Object.entries(regionMap)) {
                if (region.includes(key)) {
                    return suffix;
                }
            }
            return '';
        }

        async function searchStocks() {
            const query = document.getElementById('searchInput').value.trim();
            const apiKey = getApiKey();

            if (!query) {
                showError('Please enter a stock symbol or company name');
                return;
            }

            if (!apiKey) {
                showError('Please enter your Alpha Vantage API key');
                return;
            }

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="search-loading">Searching...</div>';
            resultsDiv.classList.add('active');

            try {
                const response = await fetch(
                    `https://www.alphavantage.co/query?function=SYMBOL_SEARCH&keywords=${encodeURIComponent(query)}&apikey=${apiKey}`
                );
                const data = await response.json();

                if (data['bestMatches'] && data['bestMatches'].length > 0) {
                    let html = '';
                    for (const match of data['bestMatches'].slice(0, 10)) {
                        const symbol = match['1. symbol'];
                        const name = match['2. name'];
                        const region = match['4. region'];
                        const suffix = getExchangeSuffixFromRegion(region);
                        const fullSymbol = symbol + suffix;
                        html += `
                            <div class="search-result-item" onclick="selectSearchResult('${fullSymbol}', '${name}')">
                                <div class="search-result-symbol">${fullSymbol}</div>
                                <div class="search-result-name">${name} (${region})</div>
                            </div>
                        `;
                    }
                    resultsDiv.innerHTML = html;
                } else if (data['Note']) {
                    resultsDiv.innerHTML = '<div class="search-loading">API rate limit reached. Please wait a minute.</div>';
                } else {
                    resultsDiv.innerHTML = '<div class="search-no-results">No results found</div>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<div class="search-no-results">Error searching. Please try again.</div>';
                showError(`Search error: ${error.message}`);
            }
        }

        function selectSearchResult(symbol, name) {
            document.getElementById('symbol').value = symbol;
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').classList.remove('active');
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('symbol').focus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('apiKey');
            if (saved) {
                document.getElementById('apiKey').value = saved;
            }

            document.getElementById('apiKey').addEventListener('change', () => {
                localStorage.setItem('apiKey', document.getElementById('apiKey').value);
            });

            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchStocks();
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    document.getElementById('searchResults').classList.remove('active');
                }
            });

            renderStocks();
        });
    </script>
</body>
</html>
